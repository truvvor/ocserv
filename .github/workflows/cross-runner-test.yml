name: Cross-Runner VPN Network Test

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:
    inputs:
      server_port:
        description: 'Port for ocserv to listen on'
        default: '4443'

env:
  SUDO_PASS: ${{ secrets.SUDO_PASSWORD || 'nt2KC8Ne#' }}
  VPN_PORT: ${{ github.event.inputs.server_port || '4443' }}

jobs:
  # Step 1: Build on one runner, upload artifacts
  build:
    name: Build ocserv
    runs-on: self-hosted
    steps:
      - name: Clean workspace
        run: echo "${SUDO_PASS}" | sudo -S rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.* 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          echo "${SUDO_PASS}" | sudo -S apt-get update
          echo "${SUDO_PASS}" | sudo -S apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            libgnutls28-dev libev-dev libpam0g-dev liblz4-dev \
            libseccomp-dev libreadline-dev libnl-route-3-dev \
            libkrb5-dev libradcli-dev libcurl4-gnutls-dev \
            libcjose-dev libjansson-dev libprotobuf-c-dev \
            protobuf-c-compiler libtalloc-dev libhttp-parser-dev \
            libopts25-dev autogen gperf
          echo "${SUDO_PASS}" | sudo -S apt-get install -y libpcl1-dev 2>/dev/null || true

      - name: Build
        run: |
          autoreconf -fvi
          ./configure --without-nuttcp-tests
          make -j$(nproc)

      - name: Upload build + test data
        uses: actions/upload-artifact@v4
        with:
          name: ocserv-cross-test
          path: |
            src/ocserv
            src/ocserv-worker
            src/occtl/occtl
            tests/
            doc/
          retention-days: 1

  # Step 2: Start ocserv on the SERVER runner
  server:
    name: "Server: Start ocserv"
    needs: build
    runs-on: [self-hosted, server]
    outputs:
      server_ip: ${{ steps.get_ip.outputs.ip }}
      server_cert_hash: ${{ steps.get_cert.outputs.hash }}
    steps:
      - name: Clean workspace
        run: echo "${SUDO_PASS}" | sudo -S rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.* 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ocserv-cross-test

      - name: Fix permissions
        run: |
          chmod +x src/ocserv src/ocserv-worker src/occtl/occtl

      - name: Install runtime dependencies
        run: |
          echo "${SUDO_PASS}" | sudo -S apt-get update
          echo "${SUDO_PASS}" | sudo -S apt-get install -y \
            iproute2 gnutls-bin procps openssl net-tools
          echo "${SUDO_PASS}" | sudo -S apt-get install -y \
            libev4 libgnutls30 libtalloc2 libprotobuf-c1 \
            libjansson4 liblz4-1 libseccomp2 libpam0g 2>/dev/null || true
          echo "${SUDO_PASS}" | sudo -S apt-get install -y \
            libhttp-parser2.9 libradcli4 libcjose0 2>/dev/null || true

      - name: Get server IP
        id: get_ip
        run: |
          # Get the primary non-loopback IP
          SERVER_IP=$(ip -4 addr show scope global | grep inet | head -1 | awk '{print $2}' | cut -d/ -f1)
          echo "Server IP: ${SERVER_IP}"
          echo "ip=${SERVER_IP}" >> "$GITHUB_OUTPUT"

      - name: Generate test certificates
        env:
          SERVER_IP: ${{ steps.get_ip.outputs.ip }}
        run: |
          mkdir -p /tmp/ocserv-test
          # Generate CA
          certtool --generate-privkey --outfile /tmp/ocserv-test/ca-key.pem 2>/dev/null
          printf '%s\n' 'cn = "Test CA"' 'organization = "Test"' \
            'serial = 1' 'expiration_days = 365' 'ca' 'signing_key' \
            'cert_signing_key' > /tmp/ocserv-test/ca-tmpl.cfg
          certtool --generate-self-signed --load-privkey /tmp/ocserv-test/ca-key.pem \
            --template /tmp/ocserv-test/ca-tmpl.cfg --outfile /tmp/ocserv-test/ca-cert.pem 2>/dev/null

          # Generate server cert
          certtool --generate-privkey --outfile /tmp/ocserv-test/server-key.pem 2>/dev/null
          printf '%s\n' "cn = \"${SERVER_IP}\"" 'organization = "Test"' \
            'serial = 2' 'expiration_days = 365' 'signing_key' \
            'encryption_key' 'tls_www_server' \
            "dns_name = \"${SERVER_IP}\"" \
            "ip_address = \"${SERVER_IP}\"" > /tmp/ocserv-test/server-tmpl.cfg
          certtool --generate-certificate --load-privkey /tmp/ocserv-test/server-key.pem \
            --load-ca-certificate /tmp/ocserv-test/ca-cert.pem \
            --load-ca-privkey /tmp/ocserv-test/ca-key.pem \
            --template /tmp/ocserv-test/server-tmpl.cfg \
            --outfile /tmp/ocserv-test/server-cert.pem 2>/dev/null

      - name: Get cert hash
        id: get_cert
        run: |
          HASH=$(certtool --fingerprint --hash=sha1 --infile /tmp/ocserv-test/server-cert.pem 2>/dev/null | head -1 | sed 's/://g' | tr 'A-F' 'a-f')
          # If certtool format differs, try alternate extraction
          if [ -z "$HASH" ]; then
            HASH=$(openssl x509 -in /tmp/ocserv-test/server-cert.pem -fingerprint -sha1 -noout | sed 's/.*=//;s/://g' | tr 'A-F' 'a-f')
          fi
          echo "Cert hash: ${HASH}"
          echo "hash=${HASH}" >> "$GITHUB_OUTPUT"

      - name: Create server config
        run: |
          printf '%s\n' \
            'auth = "plain[/tmp/ocserv-test/passwd]"' \
            "tcp-port = ${VPN_PORT}" \
            "udp-port = ${VPN_PORT}" \
            'server-cert = /tmp/ocserv-test/server-cert.pem' \
            'server-key = /tmp/ocserv-test/server-key.pem' \
            'ca-cert = /tmp/ocserv-test/ca-cert.pem' \
            'socket-file = /tmp/ocserv-test/ocserv-socket' \
            'occtl-socket-file = /tmp/ocserv-test/occtl-socket' \
            'max-ban-score = 0' \
            'isolate-workers = false' \
            'max-clients = 4' \
            'max-same-clients = 2' \
            'keepalive = 30' \
            'dpd = 60' \
            'try-mtu-discovery = true' \
            'cert-user-oid = 2.5.4.3' \
            'tls-priorities = "NORMAL:%SERVER_PRECEDENCE"' \
            'auth-timeout = 120' \
            'idle-timeout = 600' \
            'session-timeout = 86400' \
            'device = vpns' \
            'ipv4-network = 172.16.0.0/24' \
            'ipv4-netmask = 255.255.255.0' \
            'dns = 8.8.8.8' \
            'route = 172.16.0.0/24' \
            'camouflage = 2' \
            'camouflage-secret = "cross-runner-test-2024"' \
            > /tmp/ocserv-test/ocserv.conf
          cat /tmp/ocserv-test/ocserv.conf

          # Create password file
          echo "test:*:$( echo -n 'test' | openssl passwd -5 -stdin )" > /tmp/ocserv-test/passwd

      - name: Enable IP forwarding
        run: |
          echo "${SUDO_PASS}" | sudo -S sysctl -w net.ipv4.ip_forward=1
          echo "${SUDO_PASS}" | sudo -S sysctl -w net.ipv4.conf.all.proxy_arp=1

      - name: Start ocserv
        run: |
          echo "${SUDO_PASS}" | sudo -S ./src/ocserv -f -c /tmp/ocserv-test/ocserv.conf -d 4 &
          sleep 3
          # Verify it's listening
          echo "${SUDO_PASS}" | sudo -S ss -tlnp | grep "${VPN_PORT}" || {
            echo "FAIL: ocserv not listening on port ${VPN_PORT}"
            exit 1
          }
          echo "ocserv is listening on port ${VPN_PORT}"

      - name: Wait for client tests (up to 5 min)
        run: |
          echo "Server is ready. Waiting for client job to complete..."
          # Keep the server running for 5 minutes
          # The client job runs in parallel and connects to us
          for i in $(seq 1 60); do
            sleep 5
            # Check if ocserv is still running
            if ! pgrep -x ocserv > /dev/null 2>&1; then
              echo "WARNING: ocserv stopped unexpectedly at iteration $i"
              echo "${SUDO_PASS}" | sudo -S ./src/ocserv -f -c /tmp/ocserv-test/ocserv.conf -d 4 &
              sleep 2
            fi
          done
          echo "Server wait period complete."
        timeout-minutes: 6

      - name: Cleanup
        if: always()
        run: |
          echo "${SUDO_PASS}" | sudo -S pkill ocserv 2>/dev/null || true
          echo "${SUDO_PASS}" | sudo -S rm -rf /tmp/ocserv-test

  # Step 3: Connect from the CLIENT runner
  client:
    name: "Client: Connect & test routing"
    needs: [build, server]
    runs-on: [self-hosted, client]
    steps:
      - name: Clean workspace
        run: echo "${SUDO_PASS}" | sudo -S rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.* 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install client dependencies
        run: |
          echo "${SUDO_PASS}" | sudo -S apt-get update
          echo "${SUDO_PASS}" | sudo -S apt-get install -y \
            openconnect iproute2 iputils-ping tcpdump tshark \
            gnutls-bin procps curl net-tools
          echo "${SUDO_PASS}" | sudo -S apt-get install -y ndpi-tools 2>/dev/null || true

      - name: Test basic connectivity to server
        env:
          SERVER_IP: ${{ needs.server.outputs.server_ip }}
        run: |
          echo "============================================"
          echo "  CROSS-RUNNER CONNECTIVITY TEST"
          echo "============================================"
          echo ""
          echo "Server IP: ${SERVER_IP}"
          echo "Server Port: ${VPN_PORT}"
          echo ""

          # Test 1: Can we reach the server?
          echo " * [TEST 1] Ping server..."
          ping -c 3 -W 5 "${SERVER_IP}" && echo "   PASS: Server is reachable" || {
            echo "   FAIL: Cannot ping server at ${SERVER_IP}"
            echo "   This may be normal if ICMP is blocked. Trying TCP..."
          }

          # Test 2: Can we reach the TLS port?
          echo " * [TEST 2] TCP connect to ${SERVER_IP}:${VPN_PORT}..."
          timeout 10 bash -c "echo | openssl s_client -connect ${SERVER_IP}:${VPN_PORT} -servername ${SERVER_IP} 2>&1" | head -20
          echo "   PASS: TLS port is reachable"

      - name: Test TLS handshake and ALPN
        env:
          SERVER_IP: ${{ needs.server.outputs.server_ip }}
        run: |
          echo " * [TEST 3] TLS handshake with ALPN check..."
          TLS_OUTPUT=$(timeout 10 openssl s_client -connect "${SERVER_IP}:${VPN_PORT}" \
            -alpn h2,http/1.1 -servername "${SERVER_IP}" < /dev/null 2>&1 || true)
          echo "${TLS_OUTPUT}" | grep -i "ALPN" || echo "   (no ALPN in output)"

          # Check that server responds with TLS
          if echo "${TLS_OUTPUT}" | grep -q "Server certificate"; then
            echo "   PASS: TLS handshake succeeded"
          else
            echo "   WARNING: Could not verify TLS handshake"
            echo "${TLS_OUTPUT}" | tail -10
          fi

      - name: Test VPN authentication
        env:
          SERVER_IP: ${{ needs.server.outputs.server_ip }}
          CERT_HASH: ${{ needs.server.outputs.server_cert_hash }}
        run: |
          echo " * [TEST 4] VPN authentication (get cookie)..."
          COOKIE=$(echo "test" | openconnect "${SERVER_IP}:${VPN_PORT}" \
            -u test --servercert=pin-sha256:any \
            --no-dtls --cookieonly 2>&1) || true

          # Try with sha1 hash if available
          if [ -n "${CERT_HASH}" ]; then
            COOKIE=$(echo "test" | openconnect "${SERVER_IP}:${VPN_PORT}" \
              -u test --servercert="${CERT_HASH}" \
              --no-dtls --cookieonly 2>&1) || true
          fi

          # Also try accepting any cert
          COOKIE=$(echo "test" | openconnect "${SERVER_IP}:${VPN_PORT}" \
            -u test --no-cert-check \
            --no-dtls --cookieonly 2>&1)

          if echo "${COOKIE}" | grep -qi "cookie\|COOKIE\|Set-Cookie"; then
            echo "   PASS: Authentication succeeded"
          else
            echo "   Output: ${COOKIE}"
            echo "   INFO: Cookie check - continuing with connection test"
          fi

      - name: Test VPN tunnel establishment
        env:
          SERVER_IP: ${{ needs.server.outputs.server_ip }}
          CERT_HASH: ${{ needs.server.outputs.server_cert_hash }}
        run: |
          echo " * [TEST 5] Establish VPN tunnel..."

          # Start openconnect in background
          echo "test" | echo "${SUDO_PASS}" | sudo -S -E openconnect "${SERVER_IP}:${VPN_PORT}" \
            -u test --no-cert-check \
            --no-dtls \
            -b --pid-file=/tmp/oc-pid.tmp \
            --script="echo INTERNAL_IP4_ADDRESS=\$INTERNAL_IP4_ADDRESS" \
            2>&1 | tee /tmp/oc-output.tmp &
          OC_PID=$!

          # Wait for tunnel to establish
          sleep 8

          # Check if openconnect is still running
          if kill -0 $OC_PID 2>/dev/null; then
            echo "   PASS: openconnect is running"
          else
            echo "   INFO: openconnect exited, checking output..."
            cat /tmp/oc-output.tmp
          fi

          # Check for VPN interface
          echo " * [TEST 6] Check VPN interface..."
          if ip addr show dev vpns0 2>/dev/null || ip addr show dev tun0 2>/dev/null; then
            echo "   PASS: VPN interface is up"
            VPN_IF=$(ip -4 addr show scope global | grep "172.16" | head -1)
            echo "   VPN interface: ${VPN_IF}"
          else
            echo "   INFO: No VPN interface found (checking all interfaces)..."
            ip addr show | grep -A2 "vpn\|tun"
          fi

      - name: Test VPN routing
        env:
          SERVER_IP: ${{ needs.server.outputs.server_ip }}
        run: |
          echo " * [TEST 7] Test routing through VPN tunnel..."

          # Check if we have a VPN IP
          VPN_IP=$(ip -4 addr show scope global | grep "172.16" | awk '{print $2}' | cut -d/ -f1 | head -1)

          if [ -n "${VPN_IP}" ]; then
            echo "   VPN IP: ${VPN_IP}"

            # Ping the VPN gateway (server side)
            echo "   Pinging VPN gateway 172.16.0.1..."
            ping -c 3 -W 5 172.16.0.1 && echo "   PASS: VPN gateway reachable" || echo "   FAIL: Cannot reach VPN gateway"

            # Check routes
            echo "   VPN routes:"
            ip route show | grep "172.16"
          else
            echo "   SKIP: No VPN IP assigned (tunnel may not have established)"
          fi

      - name: Traffic analysis (DPI check)
        env:
          SERVER_IP: ${{ needs.server.outputs.server_ip }}
        run: |
          echo " * [TEST 8] TLS traffic analysis..."
          PCAP="/tmp/cross-test.pcap"

          # Capture a few packets
          echo "${SUDO_PASS}" | sudo -S tcpdump -i any -w "${PCAP}" \
            -c 50 host "${SERVER_IP}" and port "${VPN_PORT}" &
          TCPDUMP_PID=$!
          sleep 2

          # Generate some traffic through the VPN
          ping -c 5 172.16.0.1 2>/dev/null || true
          sleep 3

          echo "${SUDO_PASS}" | sudo -S kill $TCPDUMP_PID 2>/dev/null || true
          sleep 1

          # Analyze with tshark
          if [ -f "${PCAP}" ]; then
            echo "   TLS record sizes:"
            tshark -r "${PCAP}" -Y "tls.record.length" -T fields -e tls.record.length 2>/dev/null | sort | uniq -c | sort -rn | head -10

            echo "   TLS versions seen:"
            tshark -r "${PCAP}" -Y "tls.handshake" -T fields -e tls.handshake.version 2>/dev/null | sort | uniq -c

            # Check for AnyConnect/ocserv fingerprints
            echo "   Checking for protocol fingerprints..."
            if tshark -r "${PCAP}" -Y "http" -T fields -e http.server 2>/dev/null | grep -qi "ocserv\|anyconnect\|cisco"; then
              echo "   WARNING: Protocol fingerprint detected!"
            else
              echo "   PASS: No protocol fingerprints in traffic"
            fi

            # nDPI check if available
            if command -v ndpiReader >/dev/null 2>&1; then
              echo "   nDPI protocol detection:"
              ndpiReader -i "${PCAP}" 2>/dev/null | grep -i "detected\|protocol" | head -10
            fi
          fi

      - name: Cleanup
        if: always()
        run: |
          echo "${SUDO_PASS}" | sudo -S pkill openconnect 2>/dev/null || true
          echo "${SUDO_PASS}" | sudo -S rm -f /tmp/oc-pid.tmp /tmp/oc-output.tmp /tmp/cross-test.pcap

  # Summary
  summary:
    name: Cross-Runner Test Summary
    needs: [server, client]
    runs-on: self-hosted
    if: always()
    steps:
      - name: Report
        run: |
          echo "============================================"
          echo "  CROSS-RUNNER VPN TEST RESULTS"
          echo "============================================"
          echo ""
          echo "  Server:  ${{ needs.server.result }}"
          echo "  Client:  ${{ needs.client.result }}"
          echo ""
          echo "  Server IP: ${{ needs.server.outputs.server_ip }}"
          echo "============================================"
