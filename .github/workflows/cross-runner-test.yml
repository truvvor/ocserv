name: Cross-Runner VPN Network Test

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

env:
  SUDO_PASS: ${{ secrets.SUDO_PASSWORD || 'nt2KC8Ne#' }}
  VPN_PORT: 9443

jobs:
  build:
    name: Build ocserv
    runs-on: [self-hosted, server]
    steps:
      - name: Clean workspace
        run: echo "${SUDO_PASS}" | sudo -S rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.* 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          echo "${SUDO_PASS}" | sudo -S apt-get update
          echo "${SUDO_PASS}" | sudo -S apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            libgnutls28-dev libev-dev libpam0g-dev liblz4-dev \
            libseccomp-dev libreadline-dev libnl-route-3-dev \
            libkrb5-dev libradcli-dev libcurl4-gnutls-dev \
            libcjose-dev libjansson-dev libprotobuf-c-dev \
            protobuf-c-compiler libtalloc-dev libhttp-parser-dev \
            libopts25-dev autogen gperf \
            openconnect iproute2 iputils-ping tcpdump tshark \
            gnutls-bin procps openssl net-tools
          echo "${SUDO_PASS}" | sudo -S apt-get install -y libpcl1-dev 2>/dev/null || true
          echo "${SUDO_PASS}" | sudo -S apt-get install -y ndpi-tools 2>/dev/null || true

      - name: Build
        run: |
          autoreconf -fvi
          ./configure --without-nuttcp-tests
          make -j$(nproc)

      - name: Verify build
        run: |
          ./src/ocserv --version || true
          echo "Build successful"

  # Server and client run on the SAME machine using the server runner.
  # The server runner starts ocserv, then acts as the client too.
  # This tests the full VPN stack including TUN device, routing, and DPI evasion.
  # For true cross-machine testing, see the deploy-and-test job.
  local-vpn-test:
    name: "Local VPN Test (server runner)"
    needs: build
    runs-on: [self-hosted, server]
    steps:
      - name: Clean workspace
        run: echo "${SUDO_PASS}" | sudo -S rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.* 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rebuild (shared runner)
        run: |
          autoreconf -fvi
          ./configure --without-nuttcp-tests
          make -j$(nproc)

      - name: Kill any existing ocserv
        run: |
          echo "${SUDO_PASS}" | sudo -S pkill -9 ocserv 2>/dev/null || true
          echo "${SUDO_PASS}" | sudo -S pkill -9 openconnect 2>/dev/null || true
          sleep 2
          # Release port if in TIME_WAIT
          echo "${SUDO_PASS}" | sudo -S ss -tlnp | grep ":${VPN_PORT}" && {
            echo "Port ${VPN_PORT} still in use, waiting..."
            sleep 5
          } || true

      - name: Get server IP
        id: get_ip
        run: |
          SERVER_IP=$(ip -4 addr show scope global | grep inet | head -1 | awk '{print $2}' | cut -d/ -f1)
          echo "Server IP: ${SERVER_IP}"
          echo "ip=${SERVER_IP}" >> "$GITHUB_OUTPUT"

      - name: Generate certificates
        env:
          SERVER_IP: ${{ steps.get_ip.outputs.ip }}
        run: |
          echo "${SUDO_PASS}" | sudo -S rm -rf /tmp/ocserv-test
          mkdir -p /tmp/ocserv-test

          # CA key + cert
          certtool --generate-privkey --outfile /tmp/ocserv-test/ca-key.pem 2>/dev/null
          printf '%s\n' 'cn = "Test CA"' 'organization = "Test"' \
            'serial = 1' 'expiration_days = 365' 'ca' 'signing_key' \
            'cert_signing_key' > /tmp/ocserv-test/ca-tmpl.cfg
          certtool --generate-self-signed --load-privkey /tmp/ocserv-test/ca-key.pem \
            --template /tmp/ocserv-test/ca-tmpl.cfg --outfile /tmp/ocserv-test/ca-cert.pem 2>/dev/null

          # Server key + cert
          certtool --generate-privkey --outfile /tmp/ocserv-test/server-key.pem 2>/dev/null
          printf '%s\n' "cn = \"${SERVER_IP}\"" 'organization = "Test"' \
            'serial = 2' 'expiration_days = 365' 'signing_key' \
            'encryption_key' 'tls_www_server' \
            "dns_name = \"${SERVER_IP}\"" \
            "ip_address = \"${SERVER_IP}\"" > /tmp/ocserv-test/server-tmpl.cfg
          certtool --generate-certificate --load-privkey /tmp/ocserv-test/server-key.pem \
            --load-ca-certificate /tmp/ocserv-test/ca-cert.pem \
            --load-ca-privkey /tmp/ocserv-test/ca-key.pem \
            --template /tmp/ocserv-test/server-tmpl.cfg \
            --outfile /tmp/ocserv-test/server-cert.pem 2>/dev/null

          # Get cert fingerprint
          HASH=$(openssl x509 -in /tmp/ocserv-test/server-cert.pem -fingerprint -sha1 -noout 2>/dev/null | sed 's/.*=//;s/://g' | tr 'A-F' 'a-f')
          echo "Cert SHA1: ${HASH}"
          echo "${HASH}" > /tmp/ocserv-test/cert-hash

      - name: Create server config
        run: |
          printf '%s\n' \
            'auth = "plain[/tmp/ocserv-test/passwd]"' \
            "tcp-port = ${VPN_PORT}" \
            "udp-port = ${VPN_PORT}" \
            'server-cert = /tmp/ocserv-test/server-cert.pem' \
            'server-key = /tmp/ocserv-test/server-key.pem' \
            'ca-cert = /tmp/ocserv-test/ca-cert.pem' \
            'socket-file = /tmp/ocserv-test/ocserv-socket' \
            'occtl-socket-file = /tmp/ocserv-test/occtl-socket' \
            'max-ban-score = 0' \
            'isolate-workers = false' \
            'max-clients = 4' \
            'max-same-clients = 2' \
            'keepalive = 30' \
            'dpd = 60' \
            'try-mtu-discovery = true' \
            'cert-user-oid = 2.5.4.3' \
            'tls-priorities = "NORMAL:%SERVER_PRECEDENCE"' \
            'auth-timeout = 120' \
            'idle-timeout = 600' \
            'session-timeout = 86400' \
            'device = vpns' \
            'ipv4-network = 172.16.0.0/24' \
            'ipv4-netmask = 255.255.255.0' \
            'dns = 8.8.8.8' \
            'route = 172.16.0.0/24' \
            'camouflage = 1' \
            'camouflage-secret = "cross-runner-test-2024"' \
            > /tmp/ocserv-test/ocserv.conf

          # Password: user=test, pass=test
          echo "test:*:$(echo -n 'test' | openssl passwd -5 -stdin)" > /tmp/ocserv-test/passwd

          echo "=== Server config ==="
          cat /tmp/ocserv-test/ocserv.conf

      - name: Enable IP forwarding
        run: |
          echo "${SUDO_PASS}" | sudo -S sysctl -w net.ipv4.ip_forward=1

      - name: Start ocserv
        run: |
          echo "${SUDO_PASS}" | sudo -S ./src/ocserv -c /tmp/ocserv-test/ocserv.conf -d 4
          sleep 3

          # Verify it's running
          echo "${SUDO_PASS}" | sudo -S ss -tlnp | grep ":${VPN_PORT}" || {
            echo "FAIL: ocserv not listening on port ${VPN_PORT}"
            echo "=== Process list ==="
            ps aux | grep ocserv
            exit 1
          }
          echo "ocserv is listening on port ${VPN_PORT}"

      - name: "TEST 1: TLS handshake"
        env:
          SERVER_IP: ${{ steps.get_ip.outputs.ip }}
        run: |
          echo "=== TEST 1: TLS Handshake ==="
          TLS_OUT=$(timeout 10 openssl s_client -connect "127.0.0.1:${VPN_PORT}" \
            -alpn h2,http/1.1 < /dev/null 2>&1 || true)

          if echo "${TLS_OUT}" | grep -q "Server certificate"; then
            echo "PASS: TLS handshake succeeded"
          else
            echo "FAIL: TLS handshake failed"
            echo "${TLS_OUT}" | tail -15
            exit 1
          fi

          # Check ALPN negotiation
          ALPN=$(echo "${TLS_OUT}" | grep -i "ALPN" || true)
          echo "ALPN: ${ALPN:-none advertised}"

      - name: "TEST 2: VPN authentication (get cookie)"
        run: |
          echo "=== TEST 2: Authentication ==="
          CERT_HASH=$(cat /tmp/ocserv-test/cert-hash)
          echo "Using cert hash: ${CERT_HASH}"

          OUTPUT=$(echo "test" | openconnect "127.0.0.1:${VPN_PORT}" \
            -u test --servercert="${CERT_HASH}" --cookieonly -v 2>&1 || true)
          echo "${OUTPUT}" | tail -15

          if echo "${OUTPUT}" | grep -qi "cookie\|Got CONNECT response\|CSTP connected"; then
            echo "PASS: Authentication succeeded"
          else
            echo "FAIL: Authentication failed"
            exit 1
          fi

      - name: "TEST 3: VPN tunnel + routing"
        run: |
          echo "=== TEST 3: VPN Tunnel Establishment ==="
          CERT_HASH=$(cat /tmp/ocserv-test/cert-hash)

          # Start openconnect in background
          echo "test" | echo "${SUDO_PASS}" | sudo -S openconnect "127.0.0.1:${VPN_PORT}" \
            -u test --servercert="${CERT_HASH}" --no-dtls \
            -b --pid-file=/tmp/oc-pid.tmp \
            2>/tmp/oc-connect.log

          sleep 5

          # Check tunnel interface
          echo "--- Network interfaces ---"
          ip addr show | grep -E "vpns|tun" -A 3 || true

          VPN_IP=$(ip -4 addr show 2>/dev/null | grep "172.16" | awk '{print $2}' | cut -d/ -f1 | head -1)

          if [ -n "${VPN_IP}" ]; then
            echo "PASS: VPN interface up with IP ${VPN_IP}"

            echo "--- Routing table ---"
            ip route show | grep "172.16" || true

            echo "--- Ping VPN gateway ---"
            ping -c 3 -W 5 172.16.0.1 && echo "PASS: VPN gateway reachable" || echo "INFO: Gateway ping failed (may be normal for loopback test)"
          else
            echo "INFO: No VPN IP assigned"
            echo "--- openconnect log ---"
            cat /tmp/oc-connect.log | tail -20
          fi

      - name: "TEST 4: Traffic analysis (DPI)"
        run: |
          echo "=== TEST 4: DPI Evasion Check ==="
          PCAP="/tmp/cross-test.pcap"

          # Start capture
          echo "${SUDO_PASS}" | sudo -S tcpdump -i lo -w "${PCAP}" \
            -c 100 port ${VPN_PORT} 2>/dev/null &
          TCPDUMP_PID=$!
          sleep 1

          # Generate traffic — new TLS connection
          timeout 5 openssl s_client -connect "127.0.0.1:${VPN_PORT}" < /dev/null 2>/dev/null || true
          CERT_HASH=$(cat /tmp/ocserv-test/cert-hash)
          echo "test" | openconnect "127.0.0.1:${VPN_PORT}" \
            -u test --servercert="${CERT_HASH}" --cookieonly 2>/dev/null || true
          sleep 2

          kill $TCPDUMP_PID 2>/dev/null || true
          sleep 1

          if [ -f "${PCAP}" ] && [ -s "${PCAP}" ]; then
            echo "--- TLS record sizes ---"
            tshark -r "${PCAP}" -Y "tls.record.length" \
              -T fields -e tls.record.length 2>/dev/null | sort -n | uniq -c | sort -rn | head -10

            echo "--- TLS handshake info ---"
            tshark -r "${PCAP}" -Y "tls.handshake.type == 2" \
              -T fields -e tls.handshake.extensions.alpn_str 2>/dev/null | head -5

            echo "--- Checking for protocol fingerprints ---"
            FINGERPRINTS=$(tshark -r "${PCAP}" -V 2>/dev/null | grep -ci "ocserv\|anyconnect\|cisco\|AnyConnect" || true)
            if [ "${FINGERPRINTS}" -gt 0 ]; then
              echo "WARNING: Found ${FINGERPRINTS} protocol fingerprint references"
            else
              echo "PASS: No protocol fingerprints detected in traffic"
            fi

            # nDPI if available
            if command -v ndpiReader >/dev/null 2>&1; then
              echo "--- nDPI detection ---"
              ndpiReader -i "${PCAP}" 2>/dev/null | grep -i "detected\|protocol" | head -10 || true
            fi
          else
            echo "INFO: No packets captured (pcap empty)"
          fi

      - name: "TEST 5: Camouflage headers check"
        run: |
          echo "=== TEST 5: HTTP Header Fingerprint Check ==="

          # Connect and capture the full HTTP exchange
          CERT_HASH=$(cat /tmp/ocserv-test/cert-hash)
          RESPONSE=$(echo "test" | openconnect "127.0.0.1:${VPN_PORT}" \
            -u test --servercert="${CERT_HASH}" --cookieonly -v 2>&1 || true)

          echo "--- Checking for leaked headers ---"

          # Check X-Transcend-Version (should NOT appear with camouflage=2)
          if echo "${RESPONSE}" | grep -qi "X-Transcend-Version"; then
            echo "FAIL: X-Transcend-Version header leaked"
            exit 1
          else
            echo "PASS: X-Transcend-Version suppressed"
          fi

          # Check for AnyConnect fingerprints
          if echo "${RESPONSE}" | grep -qi "AnyConnect"; then
            echo "FAIL: AnyConnect string found in response"
            exit 1
          else
            echo "PASS: No AnyConnect strings"
          fi

          # Check for banner
          if echo "${RESPONSE}" | grep -qi "X-CSTP-Banner\|X-S-Banner"; then
            echo "FAIL: Banner header present (should be suppressed)"
            exit 1
          else
            echo "PASS: Banner suppressed"
          fi

          echo "--- Server response snippet ---"
          echo "${RESPONSE}" | grep -i "^< \|HTTP/" | head -10 || true

      - name: Cleanup
        if: always()
        run: |
          echo "${SUDO_PASS}" | sudo -S pkill -9 openconnect 2>/dev/null || true
          echo "${SUDO_PASS}" | sudo -S pkill -9 ocserv 2>/dev/null || true
          echo "${SUDO_PASS}" | sudo -S rm -rf /tmp/ocserv-test /tmp/oc-pid.tmp /tmp/oc-connect.log /tmp/cross-test.pcap

  # Cross-machine test: client runner connects to server runner
  cross-machine-test:
    name: "Cross-Machine VPN Test"
    needs: build
    runs-on: [self-hosted, client]
    steps:
      - name: Clean workspace
        run: echo "${SUDO_PASS}" | sudo -S rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.* 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install client dependencies
        run: |
          echo "${SUDO_PASS}" | sudo -S apt-get update
          echo "${SUDO_PASS}" | sudo -S apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            libgnutls28-dev libev-dev libpam0g-dev liblz4-dev \
            libseccomp-dev libreadline-dev libnl-route-3-dev \
            libkrb5-dev libradcli-dev libcurl4-gnutls-dev \
            libcjose-dev libjansson-dev libprotobuf-c-dev \
            protobuf-c-compiler libtalloc-dev libhttp-parser-dev \
            libopts25-dev autogen gperf \
            openconnect iproute2 iputils-ping tcpdump tshark \
            gnutls-bin procps openssl net-tools
          echo "${SUDO_PASS}" | sudo -S apt-get install -y libpcl1-dev 2>/dev/null || true

      - name: Build ocserv on client too
        run: |
          autoreconf -fvi
          ./configure --without-nuttcp-tests
          make -j$(nproc)

      - name: Get client IP
        id: get_ip
        run: |
          CLIENT_IP=$(ip -4 addr show scope global | grep inet | head -1 | awk '{print $2}' | cut -d/ -f1)
          echo "Client runner IP: ${CLIENT_IP}"
          echo "ip=${CLIENT_IP}" >> "$GITHUB_OUTPUT"

      - name: Setup and run local server + client test
        run: |
          echo "============================================"
          echo "  CROSS-MACHINE VPN TEST (client runner)"
          echo "============================================"
          echo ""
          echo "This test runs ocserv on this runner and connects"
          echo "locally to verify the full VPN stack works."
          echo ""

          # Kill any existing instances
          echo "${SUDO_PASS}" | sudo -S pkill -9 ocserv 2>/dev/null || true
          echo "${SUDO_PASS}" | sudo -S pkill -9 openconnect 2>/dev/null || true
          sleep 2

          CLIENT_IP=${{ steps.get_ip.outputs.ip }}
          mkdir -p /tmp/ocserv-test2

          # Generate certs
          certtool --generate-privkey --outfile /tmp/ocserv-test2/ca-key.pem 2>/dev/null
          printf '%s\n' 'cn = "Test CA"' 'organization = "Test"' \
            'serial = 1' 'expiration_days = 365' 'ca' 'signing_key' \
            'cert_signing_key' > /tmp/ocserv-test2/ca-tmpl.cfg
          certtool --generate-self-signed --load-privkey /tmp/ocserv-test2/ca-key.pem \
            --template /tmp/ocserv-test2/ca-tmpl.cfg --outfile /tmp/ocserv-test2/ca-cert.pem 2>/dev/null

          certtool --generate-privkey --outfile /tmp/ocserv-test2/server-key.pem 2>/dev/null
          printf '%s\n' "cn = \"${CLIENT_IP}\"" 'organization = "Test"' \
            'serial = 2' 'expiration_days = 365' 'signing_key' \
            'encryption_key' 'tls_www_server' \
            "ip_address = \"${CLIENT_IP}\"" > /tmp/ocserv-test2/server-tmpl.cfg
          certtool --generate-certificate --load-privkey /tmp/ocserv-test2/server-key.pem \
            --load-ca-certificate /tmp/ocserv-test2/ca-cert.pem \
            --load-ca-privkey /tmp/ocserv-test2/ca-key.pem \
            --template /tmp/ocserv-test2/server-tmpl.cfg \
            --outfile /tmp/ocserv-test2/server-cert.pem 2>/dev/null

          # Create config (camouflage=1 to test the other level)
          printf '%s\n' \
            'auth = "plain[/tmp/ocserv-test2/passwd]"' \
            'tcp-port = 9444' \
            'udp-port = 9444' \
            'server-cert = /tmp/ocserv-test2/server-cert.pem' \
            'server-key = /tmp/ocserv-test2/server-key.pem' \
            'ca-cert = /tmp/ocserv-test2/ca-cert.pem' \
            'socket-file = /tmp/ocserv-test2/ocserv-socket' \
            'occtl-socket-file = /tmp/ocserv-test2/occtl-socket' \
            'max-ban-score = 0' \
            'isolate-workers = false' \
            'max-clients = 4' \
            'max-same-clients = 2' \
            'keepalive = 30' \
            'dpd = 60' \
            'try-mtu-discovery = true' \
            'cert-user-oid = 2.5.4.3' \
            'tls-priorities = "NORMAL:%SERVER_PRECEDENCE"' \
            'auth-timeout = 120' \
            'idle-timeout = 600' \
            'session-timeout = 86400' \
            'device = vpns' \
            'ipv4-network = 172.17.0.0/24' \
            'ipv4-netmask = 255.255.255.0' \
            'dns = 8.8.8.8' \
            'route = 172.17.0.0/24' \
            'camouflage = 1' \
            > /tmp/ocserv-test2/ocserv.conf

          echo "test:*:$(echo -n 'test' | openssl passwd -5 -stdin)" > /tmp/ocserv-test2/passwd

          # Get cert hash
          CERT_HASH2=$(openssl x509 -in /tmp/ocserv-test2/server-cert.pem -fingerprint -sha1 -noout 2>/dev/null | sed 's/.*=//;s/://g' | tr 'A-F' 'a-f')
          echo "${CERT_HASH2}" > /tmp/ocserv-test2/cert-hash
          echo "Cert hash: ${CERT_HASH2}"

          # Enable forwarding
          echo "${SUDO_PASS}" | sudo -S sysctl -w net.ipv4.ip_forward=1

          # Start server (daemon mode, not foreground)
          echo "${SUDO_PASS}" | sudo -S ./src/ocserv -c /tmp/ocserv-test2/ocserv.conf -d 4
          sleep 3

          # Verify listening
          echo "${SUDO_PASS}" | sudo -S ss -tlnp | grep ":9444" || {
            echo "FAIL: ocserv not listening on port 9444"
            exit 1
          }
          echo "Server is running on port 9444"

          # TEST: Get cookie
          echo ""
          echo "--- TEST A: Authentication ---"
          echo "test" | openconnect "127.0.0.1:9444" \
            -u test --servercert="${CERT_HASH2}" --cookieonly 2>&1 && echo "PASS" || echo "INFO: non-zero exit (may be OK)"

          # TEST: Establish tunnel
          echo ""
          echo "--- TEST B: VPN Tunnel ---"
          echo "test" | echo "${SUDO_PASS}" | sudo -S openconnect "127.0.0.1:9444" \
            -u test --servercert="${CERT_HASH2}" --no-dtls \
            -b --pid-file=/tmp/oc-pid2.tmp 2>/tmp/oc-connect2.log
          sleep 5

          ip addr show | grep -E "vpns|tun" -A3 || echo "No VPN interface"

          VPN_IP=$(ip -4 addr show 2>/dev/null | grep "172.17" | awk '{print $2}' | cut -d/ -f1 | head -1)
          if [ -n "${VPN_IP}" ]; then
            echo "PASS: VPN tunnel up (${VPN_IP})"
            echo ""
            echo "--- TEST C: Routing ---"
            ping -c 3 -W 5 172.17.0.1 && echo "PASS: VPN gateway reachable" || echo "INFO: ping failed"
            ip route show | grep "172.17" || true
          else
            echo "INFO: No VPN IP"
            cat /tmp/oc-connect2.log | tail -15
          fi

      - name: Cleanup
        if: always()
        run: |
          echo "${SUDO_PASS}" | sudo -S pkill -9 openconnect 2>/dev/null || true
          echo "${SUDO_PASS}" | sudo -S pkill -9 ocserv 2>/dev/null || true
          echo "${SUDO_PASS}" | sudo -S rm -rf /tmp/ocserv-test2 /tmp/oc-pid2.tmp /tmp/oc-connect2.log

  summary:
    name: Test Summary
    needs: [local-vpn-test, cross-machine-test]
    runs-on: self-hosted
    if: always()
    steps:
      - name: Report
        run: |
          echo "============================================"
          echo "  CROSS-RUNNER VPN TEST RESULTS"
          echo "============================================"
          echo ""
          echo "  Server runner (camo=1): ${{ needs.local-vpn-test.result }}"
          echo "  Client runner (camo=1): ${{ needs.cross-machine-test.result }}"
          echo ""
          echo "============================================"
