name: Camouflage DPI Evasion Tests

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

env:
  SUDO_PASS: ${{ secrets.SUDO_PASSWORD || 'nt2KC8Ne#' }}

jobs:
  build:
    name: Build ocserv with camouflage
    runs-on: self-hosted
    steps:
      - name: Clean workspace
        run: echo "${SUDO_PASS}" | sudo -S rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.* 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          echo "${SUDO_PASS}" | sudo -S apt-get update
          echo "${SUDO_PASS}" | sudo -S apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            libgnutls28-dev libev-dev libpam0g-dev liblz4-dev \
            libseccomp-dev libreadline-dev libnl-route-3-dev \
            libkrb5-dev libradcli-dev libcurl4-gnutls-dev \
            libcjose-dev libjansson-dev libprotobuf-c-dev \
            protobuf-c-compiler libtalloc-dev libhttp-parser-dev \
            libopts25-dev autogen gperf \
            nuttcp openconnect iproute2 iputils-ping \
            tcpdump tshark gnutls-bin procps
          # Optional packages (may not exist on all distros)
          echo "${SUDO_PASS}" | sudo -S apt-get install -y libpcl1-dev 2>/dev/null || true
          echo "${SUDO_PASS}" | sudo -S apt-get install -y ndpi-tools 2>/dev/null || true

      - name: Configure
        run: |
          autoreconf -fvi
          ./configure --without-nuttcp-tests

      - name: Build
        run: make -j$(nproc)

      - name: Verify build
        run: |
          ./src/ocserv --version || true
          echo "Build successful"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ocserv-build
          path: |
            src/ocserv
            src/ocserv-worker
            src/occtl/occtl
          retention-days: 1

  test-camouflage-level1:
    name: "Test: Camouflage Level 1"
    needs: build
    runs-on: self-hosted
    steps:
      - name: Clean workspace
        run: echo "${SUDO_PASS}" | sudo -S rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.* 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          echo "${SUDO_PASS}" | sudo -S apt-get update
          echo "${SUDO_PASS}" | sudo -S apt-get install -y \
            openconnect iproute2 iputils-ping nuttcp \
            tcpdump tshark gnutls-bin procps
          # Install runtime libs - names vary by Ubuntu version
          echo "${SUDO_PASS}" | sudo -S apt-get install -y \
            libev4 libgnutls30 libtalloc2 libprotobuf-c1 \
            libjansson4 liblz4-1 libseccomp2 libpam0g 2>/dev/null || true
          echo "${SUDO_PASS}" | sudo -S apt-get install -y \
            libhttp-parser2.9 libradcli4 libcjose0 2>/dev/null || true
          echo "${SUDO_PASS}" | sudo -S apt-get install -y ndpi-tools 2>/dev/null || true

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ocserv-build
          path: src/

      - name: Fix permissions
        run: |
          chmod +x src/ocserv src/ocserv-worker src/occtl/occtl
          chmod +x tests/camouflage-level1

      - name: Build (for libs)
        run: |
          autoreconf -fvi 2>/dev/null || true
          ./configure 2>/dev/null || true
          make -j$(nproc) 2>/dev/null || true

      - name: Run Camouflage Level 1 Tests
        run: |
          cd tests
          echo "${SUDO_PASS}" | sudo -S -E VERBOSE=1 bash ./camouflage-level1
        timeout-minutes: 10

  test-camouflage-level2:
    name: "Test: Camouflage Level 2"
    needs: build
    runs-on: self-hosted
    steps:
      - name: Clean workspace
        run: echo "${SUDO_PASS}" | sudo -S rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.* 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          echo "${SUDO_PASS}" | sudo -S apt-get update
          echo "${SUDO_PASS}" | sudo -S apt-get install -y \
            openconnect iproute2 iputils-ping nuttcp \
            tcpdump tshark gnutls-bin procps
          echo "${SUDO_PASS}" | sudo -S apt-get install -y \
            libev4 libgnutls30 libtalloc2 libprotobuf-c1 \
            libjansson4 liblz4-1 libseccomp2 libpam0g 2>/dev/null || true
          echo "${SUDO_PASS}" | sudo -S apt-get install -y \
            libhttp-parser2.9 libradcli4 libcjose0 2>/dev/null || true
          echo "${SUDO_PASS}" | sudo -S apt-get install -y ndpi-tools 2>/dev/null || true

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ocserv-build
          path: src/

      - name: Fix permissions
        run: |
          chmod +x src/ocserv src/ocserv-worker src/occtl/occtl
          chmod +x tests/camouflage-level2

      - name: Build (for libs)
        run: |
          autoreconf -fvi 2>/dev/null || true
          ./configure 2>/dev/null || true
          make -j$(nproc) 2>/dev/null || true

      - name: Run Camouflage Level 2 Tests
        run: |
          cd tests
          echo "${SUDO_PASS}" | sudo -S -E VERBOSE=1 bash ./camouflage-level2
        timeout-minutes: 10

  test-active-probe:
    name: "Test: REQ-1 Active Probing Protection"
    needs: build
    runs-on: self-hosted
    steps:
      - name: Clean workspace
        run: echo "${SUDO_PASS}" | sudo -S rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.* 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          echo "${SUDO_PASS}" | sudo -S apt-get update
          echo "${SUDO_PASS}" | sudo -S apt-get install -y \
            openconnect iproute2 iputils-ping curl \
            gnutls-bin procps
          echo "${SUDO_PASS}" | sudo -S apt-get install -y \
            libev4 libgnutls30 libtalloc2 libprotobuf-c1 \
            libjansson4 liblz4-1 libseccomp2 libpam0g 2>/dev/null || true
          echo "${SUDO_PASS}" | sudo -S apt-get install -y \
            libhttp-parser2.9 libradcli4 libcjose0 2>/dev/null || true

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ocserv-build
          path: src/

      - name: Fix permissions
        run: |
          chmod +x src/ocserv src/ocserv-worker src/occtl/occtl
          chmod +x tests/camouflage-active-probe

      - name: Build (for libs)
        run: |
          autoreconf -fvi 2>/dev/null || true
          ./configure 2>/dev/null || true
          make -j$(nproc) 2>/dev/null || true

      - name: Run Active Probing Protection Tests
        run: |
          cd tests
          echo "${SUDO_PASS}" | sudo -S -E VERBOSE=1 bash ./camouflage-active-probe
        timeout-minutes: 10

  test-probe-secret:
    name: "Test: REQ-1.2 Secret-Path Trigger"
    needs: build
    runs-on: self-hosted
    steps:
      - name: Clean workspace
        run: echo "${SUDO_PASS}" | sudo -S rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.* 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          echo "${SUDO_PASS}" | sudo -S apt-get update
          echo "${SUDO_PASS}" | sudo -S apt-get install -y \
            openconnect iproute2 iputils-ping curl \
            gnutls-bin procps
          echo "${SUDO_PASS}" | sudo -S apt-get install -y \
            libev4 libgnutls30 libtalloc2 libprotobuf-c1 \
            libjansson4 liblz4-1 libseccomp2 libpam0g 2>/dev/null || true
          echo "${SUDO_PASS}" | sudo -S apt-get install -y \
            libhttp-parser2.9 libradcli4 libcjose0 2>/dev/null || true

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ocserv-build
          path: src/

      - name: Fix permissions
        run: |
          chmod +x src/ocserv src/ocserv-worker src/occtl/occtl
          chmod +x tests/camouflage-probe-secret

      - name: Build (for libs)
        run: |
          autoreconf -fvi 2>/dev/null || true
          ./configure 2>/dev/null || true
          make -j$(nproc) 2>/dev/null || true

      - name: Run Secret-Path Trigger Tests
        run: |
          cd tests
          echo "${SUDO_PASS}" | sudo -S -E VERBOSE=1 bash ./camouflage-probe-secret
        timeout-minutes: 10

  test-traffic-analysis:
    name: "Test: Deep Traffic Analysis"
    needs: build
    runs-on: self-hosted
    steps:
      - name: Clean workspace
        run: echo "${SUDO_PASS}" | sudo -S rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.* 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          echo "${SUDO_PASS}" | sudo -S apt-get update
          echo "${SUDO_PASS}" | sudo -S apt-get install -y \
            openconnect iproute2 iputils-ping nuttcp \
            tcpdump tshark gnutls-bin procps
          echo "${SUDO_PASS}" | sudo -S apt-get install -y \
            libev4 libgnutls30 libtalloc2 libprotobuf-c1 \
            libjansson4 liblz4-1 libseccomp2 libpam0g 2>/dev/null || true
          echo "${SUDO_PASS}" | sudo -S apt-get install -y \
            libhttp-parser2.9 libradcli4 libcjose0 2>/dev/null || true
          echo "${SUDO_PASS}" | sudo -S apt-get install -y ndpi-tools 2>/dev/null || true

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ocserv-build
          path: src/

      - name: Fix permissions
        run: |
          chmod +x src/ocserv src/ocserv-worker src/occtl/occtl
          chmod +x tests/camouflage-traffic-analysis

      - name: Build (for libs)
        run: |
          autoreconf -fvi 2>/dev/null || true
          ./configure 2>/dev/null || true
          make -j$(nproc) 2>/dev/null || true

      - name: Run Deep Traffic Analysis
        run: |
          cd tests
          echo "${SUDO_PASS}" | sudo -S -E VERBOSE=1 bash ./camouflage-traffic-analysis
        timeout-minutes: 10

  test-regression:
    name: "Test: Regression (camouflage=0)"
    needs: build
    runs-on: self-hosted
    steps:
      - name: Clean workspace
        run: echo "${SUDO_PASS}" | sudo -S rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.* 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          echo "${SUDO_PASS}" | sudo -S apt-get update
          echo "${SUDO_PASS}" | sudo -S apt-get install -y \
            openconnect iproute2 iputils-ping nuttcp \
            tcpdump tshark gnutls-bin procps \
            build-essential autoconf automake libtool pkg-config \
            libgnutls28-dev libev-dev libpam0g-dev liblz4-dev \
            libseccomp-dev libreadline-dev libnl-route-3-dev \
            libkrb5-dev libradcli-dev libcurl4-gnutls-dev \
            libcjose-dev libjansson-dev libprotobuf-c-dev \
            protobuf-c-compiler libtalloc-dev libhttp-parser-dev \
            libopts25-dev autogen gperf
          echo "${SUDO_PASS}" | sudo -S apt-get install -y libpcl1-dev 2>/dev/null || true

      - name: Build from source
        run: |
          autoreconf -fvi
          ./configure
          make -j$(nproc)

      - name: Run existing test suite (camouflage=0)
        run: |
          cd tests
          # Run the unit tests that don't require network namespaces
          echo "${SUDO_PASS}" | sudo -S -E make check 2>&1 || true
          # Show results
          cat test-suite.log 2>/dev/null | tail -30 || true
        timeout-minutes: 15

  summary:
    name: Test Summary
    needs:
      - test-camouflage-level1
      - test-camouflage-level2
      - test-active-probe
      - test-probe-secret
      - test-traffic-analysis
      - test-regression
    runs-on: self-hosted
    if: always()
    steps:
      - name: Report results
        run: |
          echo "============================================"
          echo "  CAMOUFLAGE DPI EVASION TEST RESULTS"
          echo "============================================"
          echo ""
          echo "  Level 1 (server-side):    ${{ needs.test-camouflage-level1.result }}"
          echo "  Level 2 (full):           ${{ needs.test-camouflage-level2.result }}"
          echo "  REQ-1 Active Probe:       ${{ needs.test-active-probe.result }}"
          echo "  REQ-1.2 Secret Path:      ${{ needs.test-probe-secret.result }}"
          echo "  Traffic Analysis:         ${{ needs.test-traffic-analysis.result }}"
          echo "  Regression (camo=0):      ${{ needs.test-regression.result }}"
          echo ""
          echo "============================================"
